<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ivan i Mirko – pivska tura kroz Šabac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4ECEA;--panel:#FFFFFF;--panel-2:#F0F5F4;--text:#15252A;--muted:#566A6F;--line:#D2DDDB;
  --accent:#E9A12A;--accent-ink:#1B1406;--ivan:#2F6FDE;--mirko:#E0742B;
  --ok:#2E8B57;--warn:#D9A21B;--hot:#E07A2F;--bad:#C8463A;
  --shadow:0 12px 32px rgba(15,35,40,.16);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E191C;--panel:#16252A;--panel-2:#122024;--text:#EAF2F1;--muted:#93A8AC;--line:#26393E;
    --accent:#F0A92B;--accent-ink:#1B1406;--shadow:0 12px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E191C;--panel:#16252A;--panel-2:#122024;--text:#EAF2F1;--muted:#93A8AC;--line:#26393E;
  --accent:#F0A92B;--accent-ink:#1B1406;--shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{display:flex;flex-direction:column;height:100%;width:100%;max-width:1000px;margin:0 auto;
  padding:10px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));gap:10px}
.hud{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:8px;flex:none}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-size:26px;line-height:1}
.brand-txt{min-width:0}
.title{font-weight:800;font-size:18px;letter-spacing:-.015em;line-height:1.1}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ivan-c{color:var(--ivan)}.mirko-c{color:var(--mirko)}
.icon-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:12px;height:38px;padding:0 14px;font:700 14px/1 inherit;font-family:inherit;cursor:pointer;flex:none}
.hud-btns{display:flex;gap:6px;flex:none}
.icon-btn:focus-visible,.btn:focus-visible,.x:focus-visible,.star:focus-visible{outline:3px solid var(--ivan);outline-offset:2px}
.hud-row{display:flex;align-items:center;gap:10px}
.pasos{display:flex;gap:5px}
.slot{width:16px;height:22px;border:2px solid var(--line);border-top-width:0;border-radius:2px 2px 6px 6px;background:transparent;transition:background .3s,border-color .3s,transform .3s}
.slot.on{background:linear-gradient(to top,var(--beer) 0 70%,var(--foam) 70% 100%);border-color:rgba(0,0,0,.2);transform:translateY(-1px)}
.count{margin-left:auto;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.meter{flex:1;height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;transition:width .4s ease,background .4s ease}
.state{font-size:12.5px;font-weight:700;min-width:84px;text-align:right;color:var(--muted)}
.stage{flex:1 1 auto;min-height:200px;position:relative;border-radius:18px;overflow:hidden;background:#8DC8E8;box-shadow:var(--shadow)}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);background:rgba(16,28,32,.88);color:#fff;
  padding:8px 14px;border-radius:99px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.controls{display:grid;grid-template-columns:76px 1fr 76px;gap:10px;flex:none}
.btn{appearance:none;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 15.5px/1.1 inherit;font-family:inherit;
  min-height:56px;padding:0 14px;cursor:pointer;touch-action:manipulation;transition:transform .08s,opacity .2s,background .2s}
.btn:active,.btn.pressed{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.dir{background:var(--panel);color:var(--text);border:1px solid var(--line);font-size:22px;touch-action:none}
.btn.dir.pressed{background:var(--panel-2)}
.btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
.btn.small{min-height:42px;font-size:14px;padding:0 14px;border-radius:12px;white-space:nowrap}
.act{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px;flex:none}
@media (hover:none){.hint{display:none}}
.modal-back{position:fixed;inset:0;z-index:30;background:rgba(8,16,18,.58);display:none;align-items:flex-end;justify-content:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.modal-back.open{display:flex;animation:fade .18s ease}
.modal{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--panel);color:var(--text);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow);animation:up .22s ease}
@media (min-width:700px){.modal-back{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.m-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.m-kicker{font-size:13px;font-weight:700;color:var(--muted)}
h2{margin:2px 0 2px;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.m-sub{color:var(--muted);font-size:14px;line-height:1.4}
.x{border:0;background:var(--panel-2);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;flex:none;font-family:inherit}
.waiter{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.waiter p{margin:0;font-size:14.5px;font-weight:600}
.avatar{font-size:26px;line-height:1}
.beers{display:grid;gap:10px}
.beer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.b-name{font-weight:800;font-size:16px}
.abv{font-weight:600;font-size:12.5px;color:var(--muted);margin-left:6px}
.b-desc{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.b-tried{font-size:12.5px;font-weight:700;color:var(--ok);margin-top:4px}
.st{color:var(--warn);letter-spacing:1px}
.glass{display:block;width:24px;height:32px;border:2px solid rgba(0,0,0,.2);border-top:0;border-radius:3px 3px 8px 8px;
  background:linear-gradient(to top,var(--beer) 0 72%,var(--foam) 72% 100%);flex:none;box-shadow:inset -4px 0 0 rgba(255,255,255,.25)}
.glass.empty{background:transparent;border-color:var(--line);box-shadow:none}
.glass.big{width:54px;height:74px;border-width:3px;border-radius:5px 5px 14px 14px}
.m-actions{display:flex;gap:10px;margin-top:14px}
.m-actions .btn{flex:1;min-height:50px}
.clink{display:flex;justify-content:center;gap:2px;height:92px;align-items:flex-end;margin:4px 0 6px}
.clink .l{animation:clinkL .9s ease-out}
.clink .r{animation:clinkR .9s ease-out}
@keyframes clinkL{0%{transform:translateX(-46px) rotate(-8deg)}55%{transform:translateX(5px) rotate(12deg)}100%{transform:none}}
@keyframes clinkR{0%{transform:translateX(46px) rotate(8deg)}55%{transform:translateX(-5px) rotate(-12deg)}100%{transform:none}}
.quote{border-left:4px solid var(--ivan);background:var(--panel-2);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:14.5px}
.quote.mirko{border-color:var(--mirko)}
.quote b.ivan-n{color:var(--ivan)}.quote b.mirko-n{color:var(--mirko)}
.rate{margin-top:14px;text-align:center}
.rate-lbl{font-size:13px;font-weight:700;color:var(--muted)}
.stars{display:flex;justify-content:center;gap:4px;margin-top:4px}
.star{font-size:30px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:4px 6px;font-family:inherit}
.star.on{color:var(--warn)}
.rate-ok{font-size:12.5px;color:var(--ok);font-weight:700;min-height:16px;margin-top:2px}
.stamp{margin-top:10px;text-align:center;font-weight:800;color:var(--ok)}
.summary{display:flex;gap:14px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.big-count{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big-count small{font-size:18px;color:var(--muted);margin-left:2px;letter-spacing:0}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:5px 11px;border-radius:99px}
.fav{margin-top:6px}
.grid8{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center}
.pcard:not(.on) .pc-name{color:var(--muted)}
.pcard .glass{width:18px;height:24px}
.pc-name{font-weight:800;font-size:14px}
.pc-meta{font-size:12px;color:var(--muted);line-height:1.3}
.note{font-size:14px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.note b{color:var(--text)}
.portraits{display:flex;justify-content:center;gap:22px;margin:2px 0 6px}
.portraits figure{margin:0;text-align:center}
.portraits canvas{width:120px;height:170px;display:block}
.portraits figcaption{font-size:13px;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){
  .modal-back.open,.modal,.clink .l,.clink .r{animation:none}
  .slot,.fill,.toast{transition:none}
}
</style>
</head>

function say(who, text, dur = 2.7, delay = 0) { state.bubbles.push({who, text, start:state.t + delay, end:state.t + delay + dur}); }
function update(dt) {
  if (state.paused) return;
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), p = state.prip;
  const slow = 1 - clamp((p - 50) / 200, 0, 0.25);
  if (dir) { state.x += dir * SPEED * slow * dt; state.phase += dt * 9 * slow; state.prip = Math.max(0, p - 0.5 * dt); }
  state.look = lerp(state.look, dir, Math.min(1, dt * 8));
  if (p > 55) state.x += Math.sin(state.t * 1.2) * ((p - 55) / 45) * 16 * dt;
  state.x = clamp(state.x, 90, WORLD - 90);
  state.moving = !!dir;
  let near = null;
  for (const q of PLACES) if (INTERACT.has(q.type) && state.x > q.x + 8 && state.x < q.x + q.w - 8) { near = q; break; }
  state.near = near; refreshAction();
  if (state.prip >= 55 && !state.swayJoke) {
    state.swayJoke = true; state.bubbles = [];
    say('mirko', 'Što se ova ulica njiše?', 2.6); say('ivan', 'To nije ulica, Mirko.', 2.6, 2.7); state.banterAt = state.t + 12;
  }
  if (state.prip < 40) state.swayJoke = false;
  if (state.t > state.banterAt && !state.bubbles.length) {
    let i; do { i = Math.floor(Math.random() * BANTER.length); } while (i === state.lastBanter && BANTER.length > 1);
    state.lastBanter = i; const [a, b] = BANTER[i];
    say(a[0], a[1], 2.7); say(b[0], b[1], 2.7, 2.8); state.banterAt = state.t + 13 + Math.random() * 8;
  }
  state.shake = Math.max(0, state.shake - dt);
  for (const d of state.ducks) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy *= Math.pow(0.35, dt); if (d.scared > 0) d.scared -= dt; }
  state.ducks = state.ducks.filter(d => d.x > cam - 260 && d.x < cam + viewW + 260 && d.y > -oy - 80);
  if (state.t > state.duckAt) { if (state.ducks.length < 3) spawnDuck(); state.duckAt = state.t + 5 + Math.random() * 6; }
  if (state.shot) {
    const e = state.t - state.shot.t0;
    if (e > 1.2) state.shot = null; else if (!state.shot.fired && e >= 0.38) fire();
  } else if (state.t > state.shootAt) {
    if (state.prip >= 65) {
      if (!state.safetyJoke) { state.safetyJoke = true; state.bubbles = []; say('ivan', 'Mirko, posle ovoliko piva puška ide na osigurač.', 2.8); say('mirko', 'Važi. Patke danas imaju sreće.', 2.6, 2.9); state.banterAt = state.t + 12; }
      state.shootAt = state.t + 6;

  }

}

  }).join('');
  const favTxt = fav ? `Omiljeno: <b>${fav.name}</b> <span class="st">${stars(state.tried[fav.id])}</span>` : n ? 'Ocenite piva da bi se video favorit.' : 'Pasoš je još prazan. Prva kafana je odmah tu.';
  const endNote = n >= 8 ? 'Svih osam piva je u pasošu.' : `Neprobano: ${8 - n} od 8. Možete se vratiti Gospodar Jevremovom ili završiti ovde.`;
  openModal(`<div class="m-head"><div><div class="m-kicker">${isEnd ? 'Šabačka tvrđava' : 'Pivski pasoš'}</div><h2>${isEnd ? (n >= 8 ? 'Tura završena!' : 'Kraj ture?') : 'Ivan i Mirko'}</h2></div>
    <button class="x" data-close aria-label="Zatvori">✕</button></div>
    <div class="summary"><div class="big-count">${n}<small>/8</small></div><div><span class="badge">${title}</span><div class="m-sub fav">${favTxt}</div></div></div>
    <div class="grid8">${cards}</div>
    ${isEnd ? `<p class="note">${endNote} 🚕 Kući idu taksijem, posle piva niko ne vozi.</p>`
            : `<p class="note">Pivo podiže pripitost. Česma, ćevapi i čaša vode je spuštaju. Iznad 80 konobar ne služi pivo.</p>`}
    ${state.shots ? `<p class="note">🦆 Mirko je opalio ${state.shots} ${putW(state.shots)}. Ulovljeno patki: 0.</p>` : ''}
    <div class="m-actions"><button class="btn ghost" data-reset>Nova tura</button><button class="btn" data-close>${isEnd ? 'Nastavi šetnju' : 'Nazad na ulicu'}</button></div>`);
}
function drawPortrait(el, g) {
  if (!el) return;
  const d = Math.min(window.devicePixelRatio || 1, 2.5), W = 120, H = 170;
  el.width = W * d; el.height = H * d;
  const prev = c; c = el.getContext('2d');
  const sc = H / 208; c.setTransform(d * sc, 0, 0, d * sc, 0, 0);
  drawGuy(g, (W / sc) / 2, 200, 0, false, 0, 0);
  c = prev;
}
function openIntro() {
  introHas = triedCount() > 0 || state.x > 420;
  openModal(`<div class="m-head"><div><div class="m-kicker">Pivska tura kroz Šabac</div><h2>Ivan i Mirko u gradu</h2>
    <div class="m-sub">Gospodar Jevremova, pet kafana, Kej na Savi i Šabačka tvrđava</div></div></div>
    <div class="portraits">
      <figure><canvas id="pI"></canvas><figcaption><b class="ivan-c">Ivan</b>, levo</figcaption></figure>
      <figure><canvas id="pM"></canvas><figcaption><b class="mirko-c">Mirko</b>, desno, lovac</figcaption></figure>
    </div>
    <p class="note"><b>Cilj:</b> osam vrsta piva iz pet kafana u pivskom pasošu, pa kraj ture kod Šabačke tvrđave.</p>
    <p class="note"><b>Pripitost:</b> svako pivo je podiže. Kad ulica krene da se njiše, svratite na česmu, ćevape ili tražite čašu vode. Iznad 80 konobar ne služi pivo.</p>
    <p class="note"><b>Lov:</b> Mirko nosi dvocevku i s vremena na vreme opali u nebo. Patke su bezbedne, nikad ne pogodi.</p>
    <p class="note"><b>Kontrole:</b> strelice ispod scene za šetnju, srednje dugme za ulazak. Na računaru strelice i Enter.</p>
    <div class="m-actions">${introHas ? '<button class="btn ghost" data-reset>Nova tura</button>' : ''}<button class="btn" data-start>${introHas ? 'Nastavi turu' : 'Krenimo!'}</button></div>`);
  drawPortrait($('#pI'), IVAN); drawPortrait($('#pM'), MIRKO);
}
function startLines(has) {
  state.bubbles = [];
  if (has) { say('mirko', 'Gde smo ono stali?', 2.6); say('ivan', 'Kod sledeće kafane, naravno.', 2.6, 2.7); }
  else { say('ivan', 'Plan: osam piva, jedna ulica, nula vožnje.', 3); say('mirko', 'I Šabačka tvrđava na kraju!', 2.6, 3.1); }
  state.banterAt = state.t + 14; state.shootAt = state.t + 6.5; state.duckAt = state.t + 1.5;
}
function resetTour() {
  state.x = 220; state.prip = 0; state.tried = {}; state.bubbles = []; state.swayJoke = false;
  state.shot = null; state.fx = []; state.ducks = []; state.safetyJoke = false; state.shots = 0; state.shootAt = state.t + 6.5; state.duckAt = state.t + 1.5;
  pendingCheers = false; pendingFull = false;
  save(); updateHUD(); closeModal();
  say('ivan', 'Nova tura! Osam piva, jedna ulica.', 2.8); say('mirko', 'I taksi na kraju.', 2.6, 2.9); state.banterAt = state.t + 14;
}

/* ---------- Zvuk ---------- */
let actx = null, soundOn = true;
try { soundOn = localStorage.getItem('sabac-pivska-tura-zvuk') !== '0'; } catch (e) {}
function audio() {
  if (!soundOn) return null;
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function sfxShot() {
  const a = audio(); if (!a || a.state !== 'running') return;
  const t = a.currentTime, len = Math.floor(a.sampleRate * 0.45), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1600;
  const g = a.createGain(); g.gain.value = 0.5;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t);
  const o = a.createOscillator(), og = a.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
  og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(og); og.connect(a.destination); o.start(t); o.stop(t + 0.32);
}
function sfxQuack(delay) {
  const a = audio(); if (!a || a.state !== 'running') return;
  for (let k = 0; k < 2; k++) {
    const t = a.currentTime + delay + k * 0.17;
    const o = a.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(330, t + 0.12);
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 3;
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.15);
  }
}
const sndBtn = $('#btnSnd');
function syncSnd() { sndBtn.textContent = soundOn ? '🔊' : '🔇'; sndBtn.setAttribute('aria-label', soundOn ? 'Isključi zvuk' : 'Uključi zvuk'); }
sndBtn.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('sabac-pivska-tura-zvuk', soundOn ? '1' : '0'); } catch (e) {} syncSnd(); sndBtn.blur(); if (soundOn) audio(); });
syncSnd();

/* ---------- Kontrole ---------- */
function hold(el, k) {
  const on = e => { e.preventDefault(); if (state.paused) return; keys[k] = true; el.classList.add('pressed'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { keys[k] = false; el.classList.remove('pressed'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, off));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
hold($('#btnL'), 'l'); hold($('#btnR'), 'r');
actBtn.addEventListener('click', () => { actBtn.blur(); doAction(); });
$('#btnPass').addEventListener('click', e => { e.currentTarget.blur(); openPassport(false); });
addEventListener('keydown', e => {
  if (back.classList.contains('open')) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.l = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.r = true; e.preventDefault(); }
  else if (k === 'Enter' || k === ' ' || k === 'ArrowUp' || k === 'e' || k === 'E') { e.preventDefault(); if (!e.repeat) doAction(); }
});
addEventListener('keyup', e => { const k = e.key; if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false; if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false; });
addEventListener('blur', () => { keys.l = keys.r = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { keys.l = keys.r = false; save(); } });
addEventListener('pagehide', save);
addEventListener('pointerdown', () => { if (soundOn && actx && actx.state === 'suspended') actx.resume(); }, {passive:true});

/* ---------- Petlja ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  state.t += dt; update(dt);
  if (Math.abs(state.prip - hudPrip) > 0.6) updateHUD();
  render();
  requestAnimationFrame(frame);
}
load(); updateHUD(); openIntro();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (back.classList.contains('open') && $('#pI')) { drawPortrait($('#pI'), IVAN); drawPortrait($('#pM'), MIRKO); } });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
